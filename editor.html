<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quartz 内容编辑器</title>
    <link rel="stylesheet" href="https://unpkg.com/vditor@3.9.6/dist/index.css" />
    <style>
        :root {
            --border: #e5e7eb;
            --sidebar-bg: #f9fafb;
            --active: #e0edff;
            --primary: #3b82f6;
            --text: #1f2937;
            --muted: #6b7280;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }

        .app { display: flex; flex-direction: column; height: 100vh; }

        /* 顶栏 */
        .toolbar {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; border-bottom: 1px solid var(--border);
            background: #fff; flex-shrink: 0;
        }
        .toolbar .title { font-weight: 600; margin-right: 8px; white-space: nowrap; }
        .toolbar button {
            padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px;
            background: #fff; color: var(--text); cursor: pointer; font-size: 13px;
        }
        .toolbar button:hover { background: #f3f4f6; }
        .toolbar button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        .toolbar button.danger:hover { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
        .toolbar .spacer { flex: 1; }
        .toolbar .status { font-size: 12px; color: var(--muted); white-space: nowrap; }

        /* 主体：左侧树 + 右侧编辑器 */
        .body { flex: 1; display: flex; min-height: 0; }

        .sidebar {
            width: 300px; min-width: 220px; max-width: 380px;
            background: var(--sidebar-bg); border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
        }
        .sidebar-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600;
        }
        #tree { flex: 1; overflow: auto; padding: 6px 8px; font-size: 13px; user-select: none; }

        .tree-item { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        .tree-item:hover { background: #eef1f4; }
        .tree-item.selected { background: var(--active); }
        .tree-item .arrow { width: 14px; flex-shrink: 0; color: var(--muted); text-align: center; }
        .tree-item .icon { width: 18px; flex-shrink: 0; text-align: center; }
        .tree-item .name { overflow: hidden; text-overflow: ellipsis; }
        .tree-children { margin-left: 16px; }
        .tree-children.collapsed { display: none; }
        .tree-empty { padding: 16px; color: var(--muted); font-size: 12px; text-align: center; }

        /* 编辑器区域 */
        .editor-wrap { flex: 1; min-width: 0; position: relative; background: #fff; }
        #vditor { height: 100% !important; border: none !important; border-radius: 0 !important; }
        #vditor .vditor-toolbar { border-left: none !important; border-right: none !important; }

        /* 弹窗 */
        .modal-mask {
            position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .modal {
            background: #fff; border-radius: 10px; padding: 18px; width: 380px;
            box-shadow: 0 10px 40px rgba(0,0,0,.2);
        }
        .modal h3 { margin: 0 0 12px; font-size: 15px; }
        .modal label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
        .modal input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
        .modal .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
        .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .modal .actions button {
            padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px;
        }
        .modal .actions button.ok { background: var(--primary); border-color: var(--primary); color: #fff; }
        .toast {
            position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
            background: #111827; color: #fff; padding: 8px 16px; border-radius: 8px;
            font-size: 13px; z-index: 2000; opacity: 0; transition: opacity .25s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="app">
        <!-- 顶栏 -->
        <div class="toolbar">
            <span class="title">📝 Quartz 内容编辑器</span>
            <button id="btnNew">＋ 新建</button>
            <button id="btnRename">✏️ 重命名</button>
            <button id="btnDelete">🗑 删除</button>
            <span class="spacer"></span>
            <span id="status" class="status">就绪</span>
            <button id="btnSave" class="primary">💾 保存</button>
        </div>

        <!-- 主体 -->
        <div class="body">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <span>content/</span>
                    <button id="btnRefresh" title="刷新文件树">🔄</button>
                </div>
                <div id="tree"></div>
            </aside>
            <section class="editor-wrap">
                <div id="vditor"></div>
            </section>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://unpkg.com/vditor@3.9.6/dist/index.min.js"></script>
    <script>
        const state = {
            tree: [],
            currentPath: null,
            currentDir: "",
            expanded: new Set(),
            selectedPath: null,
            dirty: false,
            saving: false,
        };

        const $ = (sel) => document.querySelector(sel);
        let vditor;

        // ---------- 工具函数 ----------
        function toast(msg) {
            const el = $("#toast");
            el.textContent = msg;
            el.classList.add("show");
            clearTimeout(el._t);
            el._t = setTimeout(() => el.classList.remove("show"), 2000);
        }

        function setStatus(msg) {
            $("#status").textContent = msg;
        }

        function parentDir(path) {
            const i = path.lastIndexOf("/");
            return i === -1 ? "" : path.slice(0, i);
        }

        function baseName(path) {
            const i = path.lastIndexOf("/");
            return i === -1 ? path : path.slice(i + 1);
        }

        // ---------- 文件树 ----------
        async function loadTree() {
            const res = await fetch("/api/tree");
            const data = await res.json();
            if (!data.ok) return;
            state.tree = data.tree;
            renderTree();
        }

        function renderTree() {
            const box = $("#tree");
            box.innerHTML = "";
            if (!state.tree.length) {
                box.innerHTML = '<div class="tree-empty">content 目录为空</div>';
                return;
            }
            const ul = document.createElement("ul");
            ul.style.cssText = "list-style:none;margin:0;padding:0;";
            state.tree.forEach((node) => ul.appendChild(buildNode(node)));
            box.appendChild(ul);
        }

        function buildNode(node) {
            const li = document.createElement("li");
            li.style.cssText = "list-style:none;margin:0;padding:0;";

            const row = document.createElement("div");
            row.className = "tree-item";
            if (state.selectedPath === node.path) row.classList.add("selected");

            if (node.type === "folder") {
                const arrow = document.createElement("span");
                arrow.className = "arrow";
                arrow.textContent = state.expanded.has(node.path) ? "▾" : "▸";
                const icon = document.createElement("span");
                icon.className = "icon";
                icon.textContent = state.expanded.has(node.path) ? "📂" : "📁";
                const name = document.createElement("span");
                name.className = "name";
                name.textContent = node.name;
                row.append(arrow, icon, name);
                row.addEventListener("click", () => {
                    if (state.expanded.has(node.path)) {
                        state.expanded.delete(node.path);
                        const kids = li.querySelector(".tree-children");
                        if (kids) kids.classList.add("collapsed");
                        arrow.textContent = "▸";
                        icon.textContent = "📁";
                    } else {
                        state.expanded.add(node.path);
                        const kids = li.querySelector(".tree-children");
                        if (kids) kids.classList.remove("collapsed");
                        arrow.textContent = "▾";
                        icon.textContent = "📂";
                    }
                });
                const kids = document.createElement("div");
                kids.className = "tree-children";
                if (!state.expanded.has(node.path)) kids.classList.add("collapsed");
                const subUl = document.createElement("ul");
                subUl.style.cssText = "list-style:none;margin:0;padding:0;";
                (node.children || []).forEach((c) => subUl.appendChild(buildNode(c)));
                kids.appendChild(subUl);
                li.append(row, kids);
            } else {
                const arrow = document.createElement("span");
                arrow.className = "arrow";
                arrow.textContent = "";
                const icon = document.createElement("span");
                icon.className = "icon";
                icon.textContent = "📄";
                const name = document.createElement("span");
                name.className = "name";
                name.textContent = node.name;
                row.append(arrow, icon, name);
                row.addEventListener("click", () => openFile(node.path));
                li.appendChild(row);
            }
            return li;
        }

        // ---------- 文件读写 ----------
        async function openFile(path) {
            if (state.dirty) await save();
            const res = await fetch("/api/file?path=" + encodeURIComponent(path));
            const data = await res.json();
            if (!data.ok) { toast("打开失败：" + data.error); return; }
            state.currentPath = path;
            state.currentDir = parentDir(path);
            state.selectedPath = path;
            state.dirty = false;
            vditor.setValue(data.content);
            setStatus("已打开：" + path);
            renderTree();
        }

        async function save() {
            if (!state.currentPath || state.saving) return;
            state.saving = true;
            setStatus("保存中…");
            try {
                const res = await fetch("/api/file", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        path: state.currentPath,
                        content: vditor.getValue(),
                    }),
                });
                const data = await res.json();
                if (data.ok) {
                    state.dirty = false;
                    setStatus("已保存：" + state.currentPath);
                } else {
                    setStatus("保存失败");
                    toast("保存失败：" + data.error);
                }
            } catch (e) {
                setStatus("保存失败");
                toast("保存失败：" + e.message);
            } finally {
                state.saving = false;
            }
        }

        // ---------- 弹窗 ----------
        function openModal({ title, label, value, placeholder, hint, okText = "确定" }) {
            return new Promise((resolve) => {
                const mask = document.createElement("div");
                mask.className = "modal-mask";
                mask.innerHTML = `
                    <div class="modal">
                        <h3>${title}</h3>
                        <label>${label}</label>
                        <input type="text" value="${value || ""}" placeholder="${placeholder || ""}" />
                        ${hint ? `<div class="hint">${hint}</div>` : ""}
                        <div class="actions">
                            <button class="cancel">取消</button>
                            <button class="ok">${okText}</button>
                        </div>
                    </div>`;
                const input = mask.querySelector("input");
                const cancel = () => { mask.remove(); resolve(null); };
                const ok = () => {
                    const v = input.value.trim();
                    if (!v) { input.focus(); return; }
                    mask.remove();
                    resolve(v);
                };
                mask.querySelector(".cancel").addEventListener("click", cancel);
                mask.querySelector(".ok").addEventListener("click", ok);
                mask.addEventListener("click", (e) => { if (e.target === mask) cancel(); });
                input.addEventListener("keydown", (e) => { if (e.key === "Enter") ok(); if (e.key === "Escape") cancel(); });
                document.body.appendChild(mask);
                input.focus();
                input.select();
            });
        }

        async function confirmDialog(title, message) {
            return new Promise((resolve) => {
                const mask = document.createElement("div");
                mask.className = "modal-mask";
                mask.innerHTML = `
                    <div class="modal">
                        <h3>${title}</h3>
                        <div style="font-size:13px;color:var(--text);">${message}</div>
                        <div class="actions">
                            <button class="cancel">取消</button>
                            <button class="ok" style="background:#dc2626;border-color:#dc2626;color:#fff;">确认删除</button>
                        </div>
                    </div>`;
                const close = (v) => { mask.remove(); resolve(v); };
                mask.querySelector(".cancel").addEventListener("click", () => close(false));
                mask.querySelector(".ok").addEventListener("click", () => close(true));
                mask.addEventListener("click", (e) => { if (e.target === mask) close(false); });
                document.body.appendChild(mask);
            });
        }

        // ---------- 新建 / 重命名 / 删除 ----------
        async function newFile() {
            const value = await openModal({
                title: "新建 Markdown 文件",
                label: "文件路径（相对 content/，可含子目录）",
                value: state.currentDir ? state.currentDir + "/新文章.md" : "新文章.md",
                hint: "例如：technotes/我的笔记.md。保存时自动创建目录。",
                okText: "创建",
            });
            if (!value) return;
            const path = value.toLowerCase().endsWith(".md") ? value : value + ".md";
            const title = baseName(path).replace(/\.md$/i, "");
            const date = new Date().toISOString().slice(0, 10);
            const template = `---\ntitle: "${title}"\ndate: ${date}\ndraft: false\n---\n\n# ${title}\n\n`;
            const res = await fetch("/api/file", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ path, content: template }),
            });
            const data = await res.json();
            if (!data.ok) { toast("新建失败：" + data.error); return; }
            const dir = parentDir(path);
            if (dir) state.expanded.add(dir);
            await loadTree();
            await openFile(path);
            toast("已创建：" + path);
        }

        async function renameFile() {
            if (!state.selectedPath) { toast("请先在左侧选择一个文件或文件夹"); return; }
            const oldPath = state.selectedPath;
            const value = await openModal({
                title: "重命名 / 移动",
                label: "新的路径（相对 content/）",
                value: oldPath,
                okText: "确定",
            });
            if (!value || value === oldPath) return;
            const res = await fetch("/api/rename", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ path: oldPath, newPath: value }),
            });
            const data = await res.json();
            if (!data.ok) { toast("重命名失败：" + data.error); return; }
            const dir = parentDir(value);
            if (dir) state.expanded.add(dir);
            if (state.currentPath === oldPath) state.currentPath = value;
            state.selectedPath = value;
            await loadTree();
            toast("已重命名：" + oldPath + " → " + value);
        }

        async function deleteNode() {
            if (!state.selectedPath) { toast("请先在左侧选择一个文件或文件夹"); return; }
            const path = state.selectedPath;
            const ok = await confirmDialog("删除确认", `确定要删除 <b>${path}</b> 吗？此操作不可恢复。`);
            if (!ok) return;
            const res = await fetch("/api/delete", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ path }),
            });
            const data = await res.json();
            if (!data.ok) { toast("删除失败：" + data.error); return; }
            if (state.currentPath === path) {
                state.currentPath = null;
                vditor.setValue("");
                setStatus("就绪");
            }
            state.selectedPath = null;
            await loadTree();
            toast("已删除：" + path);
        }

        // ---------- 初始化 ----------
        function initVditor() {
            vditor = new Vditor("vditor", {
                height: "100%",
                mode: "wysiwyg",
                toolbar: [
                    "emoji", "headings", "bold", "italic", "strike", "link", "|",
                    "list", "ordered-list", "check", "outdent", "indent", "|",
                    "quote", "line", "code", "inline-code", "|",
                    "table", "|",
                    "undo", "redo", "|",
                    "edit-mode", "content-theme", "code-theme", "outline", "preview",
                ],
                cache: { enable: false },
                placeholder: "在左侧选择一篇文章开始编辑，或点「＋ 新建」创建新文章",
                input: (value) => {
                    if (!state.currentPath) return;
                    state.dirty = true;
                    setStatus("未保存…");
                    clearTimeout(state._saveTimer);
                    state._saveTimer = setTimeout(() => save(), 800);
                },
            });
        }

        function init() {
            initVditor();
            loadTree();

            $("#btnNew").addEventListener("click", newFile);
            $("#btnRename").addEventListener("click", renameFile);
            $("#btnDelete").addEventListener("click", deleteNode);
            $("#btnRefresh").addEventListener("click", loadTree);
            $("#btnSave").addEventListener("click", save);

            document.addEventListener("keydown", (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
                    e.preventDefault();
                    save();
                }
            });
        }

        window.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
